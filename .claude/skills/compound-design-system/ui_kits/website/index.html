<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compound — Operator's Brief</title>
  <link rel="stylesheet" href="../../colors_and_type.css">
  <link rel="stylesheet" href="compound.css">
  <link rel="icon" href="../../assets/logo-compound-mark.svg" type="image/svg+xml">

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="app"></div>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="Nav.jsx"></script>
  <script type="text/babel" src="Hero.jsx"></script>
  <script type="text/babel" src="Sequence.jsx"></script>
  <script type="text/babel" src="BriefCallout.jsx"></script>
  <script type="text/babel" src="ArticleGrid.jsx"></script>
  <script type="text/babel" src="Quote.jsx"></script>
  <script type="text/babel" src="Footer.jsx"></script>
  <script type="text/babel" src="Dialog.jsx"></script>

  <script type="text/babel">
    const { useState } = React;

    const FIELD_DEFAULTS = /*EDITMODE-BEGIN*/{
      "navField": "paper",
      "heroField": "dark",
      "sequenceField": "paper",
      "briefField": "cream",
      "articlesField": "paper",
      "quoteField": "dark",
      "footerField": "dark"
    }/*EDITMODE-END*/;

    function App() {
      const [open, setOpen] = useState(false);
      const [tweaks, setTweak] = useTweaks(FIELD_DEFAULTS);
      const opts = ["paper", "cream", "dark"];
      return (
        <>
          <Nav active="Sequence" field={tweaks.navField} onCTA={() => setOpen(true)} />
          <main>
            <Hero field={tweaks.heroField} onCTA={() => setOpen(true)} />
            <Sequence field={tweaks.sequenceField} />
            <BriefCallout field={tweaks.briefField} />
            <ArticleGrid field={tweaks.articlesField} />
            <Quote field={tweaks.quoteField} />
          </main>
          <Footer field={tweaks.footerField} />
          <Dialog open={open} onClose={() => setOpen(false)} />
          <TweaksPanel title="Tweaks">
            <TweakSection title="Field per section" subtitle="Three fields: paper (canvas) · cream (callout band, 1 max) · dark (gravitas).">
              <TweakRadio label="Nav"      value={tweaks.navField}      options={opts} onChange={(v) => setTweak("navField", v)} />
              <TweakRadio label="Hero"     value={tweaks.heroField}     options={opts} onChange={(v) => setTweak("heroField", v)} />
              <TweakRadio label="Sequence" value={tweaks.sequenceField} options={opts} onChange={(v) => setTweak("sequenceField", v)} />
              <TweakRadio label="Brief"    value={tweaks.briefField}    options={opts} onChange={(v) => setTweak("briefField", v)} />
              <TweakRadio label="Articles" value={tweaks.articlesField} options={opts} onChange={(v) => setTweak("articlesField", v)} />
              <TweakRadio label="Quote"    value={tweaks.quoteField}    options={opts} onChange={(v) => setTweak("quoteField", v)} />
              <TweakRadio label="Footer"   value={tweaks.footerField}   options={opts} onChange={(v) => setTweak("footerField", v)} />
            </TweakSection>
            <TweakSection title="Presets">
              <TweakButton label="Editorial (default)" onClick={() => setTweak({ navField:"paper", heroField:"dark", sequenceField:"paper", briefField:"cream", articlesField:"paper", quoteField:"dark", footerField:"dark" })} />
              <TweakButton label="All paper"           onClick={() => setTweak({ navField:"paper", heroField:"paper", sequenceField:"paper", briefField:"paper", articlesField:"paper", quoteField:"paper", footerField:"paper" })} />
              <TweakButton label="All dark"            onClick={() => setTweak({ navField:"dark", heroField:"dark", sequenceField:"dark", briefField:"dark", articlesField:"dark", quoteField:"dark", footerField:"dark" })} />
            </TweakSection>
          </TweaksPanel>
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById('app')).render(<App />);
  </script>
</body>
</html>
