<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg);}
  .card{padding:28px;display:flex;flex-direction:column;gap:18px;}
  .meta{font-family:var(--font-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);}
  .meta .lead{color:var(--ink);}
  .row{display:flex;gap:36px;align-items:baseline;flex-wrap:wrap;}
  .num{font-family:var(--font-mono);font-size:42px;letter-spacing:0;color:var(--ink);}
  .num .accent{color:var(--red);} /* AA Large at 42px */
  .seq{font-family:var(--font-mono);font-size:13px;letter-spacing:.04em;color:var(--ink);}
  .seq .arrow{color:var(--ink-dim);margin:0 .35em;}
</style></head>
<body><div class="card">
  <div class="meta"><span class="lead">01 / SIGNAL</span> &nbsp;·&nbsp; OPERATOR'S BRIEF · MAY 2026</div>
  <div class="row">
    <span class="num"><span class="accent">$</span>150K+</span>
    <span class="num">06 / 06</span>
    <span class="num">45 min</span>
  </div>
  <div class="seq">SIGNAL <span class="arrow">→</span> SOURCE <span class="arrow">→</span> DESIGN <span class="arrow">→</span> BUILD <span class="arrow">→</span> DELIVER <span class="arrow">→</span> COMPOUND</div>
</div></body></html>
