<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg);}
  .card{padding:32px;display:flex;gap:24px;align-items:center;flex-wrap:wrap;}
  .box{width:140px;height:100px;background:#1A1916;border:1px solid var(--rule);border-radius:6px;display:flex;align-items:center;justify-content:center;}
  .box .v{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-dim);letter-spacing:.04em;}
  .stack{display:flex;flex-direction:column;align-items:center;gap:10px;}
  .lbl{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);}
</style></head>
<body><div class="card">
  <div class="stack"><div class="box"><span class="v">flat</span></div><div class="lbl">default · no shadow</div></div>
  <div class="stack"><div class="box" style="box-shadow:0 1px 0 0 rgba(0,0,0,.4);"><span class="v">--shadow-1</span></div><div class="lbl">raised card</div></div>
  <div class="stack"><div class="box" style="box-shadow:0 6px 24px -8px rgba(0,0,0,.6);"><span class="v">--shadow-2</span></div><div class="lbl">modal · panel</div></div>
  <div class="stack"><div class="box" style="box-shadow:0 0 0 1px rgba(225,29,45,.4),0 8px 32px -8px rgba(225,29,45,.35);border-color:rgba(225,29,45,.4);"><span class="v">glow-red</span></div><div class="lbl">cta hover only</div></div>
</div></body></html>
