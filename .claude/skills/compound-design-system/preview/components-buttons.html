<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg);}
  .card{padding:28px;display:flex;flex-direction:column;gap:16px;}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
  .btn{font-family:var(--font-body);font-size:15px;font-weight:500;padding:14px 22px;border-radius:2px;border:1px solid transparent;cursor:pointer;transition:all 200ms cubic-bezier(.2,.7,.2,1);display:inline-flex;align-items:center;gap:10px;letter-spacing:0;}
  .btn-primary{background:var(--red);color:var(--ink);}
  .btn-primary:hover{background:var(--red-bright);}
  .btn-secondary{background:transparent;color:var(--ink);border-color:var(--rule);}
  .btn-secondary:hover{border-color:var(--ink);}
  .btn-ghost{background:transparent;color:var(--ink);border-color:transparent;padding:14px 0;text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:6px;}
  .btn-ghost:hover{text-decoration-color:var(--red);}
  .lbl{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);}
  .arrow{font-family:var(--font-mono);}
</style></head>
<body><div class="card">
  <div class="lbl">Primary · Secondary · Ghost</div>
  <div class="row">
    <button class="btn btn-primary">Book the diagnostic call. <span class="arrow">→</span></button>
    <button class="btn btn-secondary">Read the Operator's Brief</button>
    <button class="btn btn-ghost">Watch the short <span class="arrow">→</span></button>
  </div>
  <div class="lbl" style="color:#5a564f;">Hover · primary darkens to red-bright; secondary border shifts to ink; ghost underline shifts to red. Never scale.</div>
</div></body></html>
