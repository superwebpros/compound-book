<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg);}
  .wrap{padding:24px;display:flex;gap:14px;flex-wrap:wrap;}
  .field{flex:1;min-width:240px;display:flex;flex-direction:column;gap:6px;}
  label{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);}
  input,textarea,select{font-family:var(--font-body);font-size:15px;color:var(--ink);background:transparent;border:1px solid var(--rule);border-bottom:1px solid var(--ink-dim);border-radius:2px;padding:12px 14px;outline:0;transition:border-color 160ms;}
  input:focus,textarea:focus{border-color:var(--ink);}
  input.err{border-color:var(--red);}
  .err-msg{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.04em;color:var(--red);}
  .help{font-family:var(--font-body);font-size:12.5px;color:var(--ink-dim);}
</style></head>
<body><div class="wrap">
  <div class="field"><label>Email</label><input value="ops@compoundorg.com" placeholder="you@company.com"><div class="help">We reply within one business day.</div></div>
  <div class="field"><label>Annual constraint cost</label><input class="err" value="$0"><div class="err-msg">If under $150K, the math doesn't work yet.</div></div>
</div></body></html>
