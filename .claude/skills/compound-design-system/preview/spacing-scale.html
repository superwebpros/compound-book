<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg);}
  .card{padding:20px;display:flex;flex-direction:column;gap:10px;}
  .row{display:flex;align-items:center;gap:12px;}
  .label{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);width:64px;}
  .bar{height:14px;background:var(--red);border-radius:1px;}
  .num{font-family:var(--font-mono);font-size:11px;color:var(--ink-dim);}
</style></head>
<body><div class="card">
  <div class="row"><div class="label">1</div><div class="bar" style="width:4px;"></div><div class="num">4px</div></div>
  <div class="row"><div class="label">2</div><div class="bar" style="width:8px;"></div><div class="num">8px</div></div>
  <div class="row"><div class="label">3</div><div class="bar" style="width:12px;"></div><div class="num">12px</div></div>
  <div class="row"><div class="label">4</div><div class="bar" style="width:16px;"></div><div class="num">16px</div></div>
  <div class="row"><div class="label">5</div><div class="bar" style="width:24px;"></div><div class="num">24px</div></div>
  <div class="row"><div class="label">6</div><div class="bar" style="width:32px;"></div><div class="num">32px</div></div>
  <div class="row"><div class="label">7</div><div class="bar" style="width:48px;"></div><div class="num">48px</div></div>
  <div class="row"><div class="label">8</div><div class="bar" style="width:64px;"></div><div class="num">64px</div></div>
  <div class="row"><div class="label">9</div><div class="bar" style="width:96px;"></div><div class="num">96px</div></div>
  <div class="row"><div class="label">10</div><div class="bar" style="width:128px;"></div><div class="num">128px</div></div>
</div></body></html>
