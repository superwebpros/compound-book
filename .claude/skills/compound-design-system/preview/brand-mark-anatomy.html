<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg);}
  .card{padding:28px;display:flex;gap:32px;align-items:center;}
  .mark{flex-shrink:0;width:160px;height:160px;display:flex;align-items:center;justify-content:center;}
  .mark img{width:100%;height:100%;object-fit:contain;}
  .legend{display:flex;flex-direction:column;gap:10px;}
  .row{display:flex;gap:12px;align-items:center;font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;color:var(--ink);}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--ink);flex-shrink:0;}
  .dot.red{background:var(--red);}
  .dot.scatter{background:transparent;position:relative;}
  .dot.scatter::before,.dot.scatter::after{content:"";position:absolute;width:3px;height:3px;border-radius:50%;background:var(--ink);}
  .dot.scatter::before{top:0;left:6px;}
  .dot.scatter::after{bottom:1px;left:1px;}
  .dot.scatter span{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--ink);top:5px;right:0;}
  .row .dim{color:var(--ink-dim);}
</style></head>
<body><div class="card">
  <div class="mark"><img src="../assets/logo-compound-mark.svg" alt="Compound atom"></div>
  <div class="legend">
    <div class="row"><span class="dot red"></span>Red core <span class="dim">— the nucleus · the load-bearing element</span></div>
    <div class="row"><span class="dot scatter"><span></span></span>Electron field <span class="dim">— six points of light, the six stages</span></div>
    <div class="row"><span class="dot"></span>Implied orbit <span class="dim">— motion is felt, not drawn</span></div>
    <div class="row"><span class="dim">Signal · Source · Design · Build · Deliver · Compound</span></div>
  </div>
</div></body></html>
