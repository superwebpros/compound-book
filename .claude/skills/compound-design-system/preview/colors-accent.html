<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg);}
  .card{padding:24px;display:flex;flex-direction:column;gap:14px;}
  .row{display:flex;gap:10px;}
  .swatch{flex:1;border-radius:var(--radius-2);padding:18px;display:flex;flex-direction:column;justify-content:space-between;min-height:120px;color:#fff;}
  .name{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;}
  .hex{font-family:var(--font-mono);font-size:11px;opacity:.85;}
  .note{color:var(--ink-dim);font-family:var(--font-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;}
</style></head>
<body><div class="card">
  <div class="row">
    <div class="swatch" style="background:#E11D2D;"><div class="name">--red</div><div class="hex">#E11D2D · primary</div></div>
    <div class="swatch" style="background:#FF2A3C;"><div class="name">--red-bright</div><div class="hex">#FF2A3C · hover · urgency</div></div>
  </div>
  <div class="note">Red is the mechanism, not the brand. Used everywhere, it loses its load.</div>
</div></body></html>
