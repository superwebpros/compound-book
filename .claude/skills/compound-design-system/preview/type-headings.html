<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg);}
  .card{padding:24px;display:grid;grid-template-columns:88px 1fr;gap:14px 20px;align-items:baseline;}
  .label{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);}
  .h{font-family:var(--font-display);color:var(--ink);font-weight:800;letter-spacing:-.025em;}
  .h1{font-size:54px;line-height:1.0;letter-spacing:-.03em;}
  .h2{font-size:40px;line-height:1.04;letter-spacing:-.025em;}
  .h3{font-size:28px;line-height:1.1;letter-spacing:-.02em;}
  .lede{font-family:var(--font-body);font-weight:500;font-size:20px;line-height:1.3;color:var(--ink);}
</style></head>
<body><div class="card">
  <div class="label">H1 / 54</div><div class="h h1">Inside <em>Compound.</em></div>
  <div class="label">H2 / 40</div><div class="h h2">For leaders, not learners.</div>
  <div class="label">H3 / 28</div><div class="h h3">The <span class="hit-block">Compound Sequence</span>.</div>
  <div class="label">Lede / 20</div><div class="lede">Default emphasis = red rule. Highlighter block once per page.</div>
</div></body></html>
