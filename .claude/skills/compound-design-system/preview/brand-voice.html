<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg);}
  .wrap{padding:24px;display:flex;flex-direction:column;gap:14px;}
  .row{display:flex;gap:14px;align-items:flex-start;}
  .marker{flex-shrink:0;width:10px;height:10px;border-radius:50%;margin-top:7px;}
  .ok{background:var(--ink);}
  .no{background:var(--red);}
  .text{font-family:var(--font-body);font-size:14.5px;line-height:1.5;color:var(--ink);}
  .text strike{color:var(--ink-dim);text-decoration:line-through;text-decoration-color:var(--red);}
  .text b{font-weight:700;}
  .lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);width:32px;flex-shrink:0;margin-top:4px;}
</style></head>
<body><div class="wrap">
  <div class="row"><span class="lbl">YES</span><span class="marker ok"></span><span class="text">"You bought the tools. You sent someone to a training. <b>Nothing changed.</b>"</span></div>
  <div class="row"><span class="lbl">NO</span><span class="marker no"></span><span class="text"><strike>"Leverage our cutting-edge AI-powered transformation platform."</strike></span></div>
  <div class="row"><span class="lbl">YES</span><span class="marker ok"></span><span class="text">"It's not a tool problem. It's an <b>operating</b> problem."</span></div>
  <div class="row"><span class="lbl">NO</span><span class="marker no"></span><span class="text"><strike>"Join the movement of operators redesigning the future of work."</strike></span></div>
</div></body></html>
