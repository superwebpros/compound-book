<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg);}
  .card{padding:24px;display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;}
  .box{background:var(--surface-1,#131211);border:1px solid var(--rule);width:96px;height:64px;display:flex;align-items:center;justify-content:center;}
  .box .v{font-family:var(--font-mono);font-size:11px;color:var(--ink-dim);letter-spacing:.04em;}
  .stack{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .lbl{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);}
</style></head>
<body><div class="card">
  <div class="stack"><div class="box" style="border-radius:0;"><span class="v">0px</span></div><div class="lbl">--radius-0</div></div>
  <div class="stack"><div class="box" style="border-radius:2px;"><span class="v">2px</span></div><div class="lbl">--radius-1</div></div>
  <div class="stack"><div class="box" style="border-radius:4px;"><span class="v">4px</span></div><div class="lbl">--radius-2</div></div>
  <div class="stack"><div class="box" style="border-radius:8px;"><span class="v">8px</span></div><div class="lbl">--radius-3</div></div>
  <div class="stack"><div class="box" style="border-radius:999px;width:120px;"><span class="v">pill</span></div><div class="lbl">--radius-pill</div></div>
</div></body></html>
