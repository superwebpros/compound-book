<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg);}
  .card{padding:32px 36px;display:flex;flex-direction:column;gap:18px;}
  .meta{font-family:var(--font-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);}
  .display{font-family:var(--font-display);font-weight:800;font-size:60px;line-height:1.0;letter-spacing:-0.03em;color:var(--ink);text-wrap:balance;margin:0;}
  .footnote{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);display:flex;align-items:center;gap:10px;}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--red);flex-shrink:0;}
</style></head>
<body><div class="card">
  <div class="meta">Display · Archivo · 800 / 60 · em = red rule</div>
  <h1 class="display">Stop transforming. Start <em>compounding</em>.</h1>
  <div class="footnote"><span class="dot"></span>Default emphasis · &lt;em&gt; renders as a red rule beneath the word.</div>
</div></body></html>
