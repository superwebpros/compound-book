project:
  type: book
  output-dir: _book

book:
  title: "Co-Intelligent Co-Operation"
  subtitle: "How to build the Human+AI Company of the Future...Today"
  author:
    - name: Jesse Flores
      affiliation: Compound
    - name: Julie Mann
      affiliation: Compound
  date: "2026-06-01"
  site-url: https://books.compoundorg.com
  cover-image: assets/cover.png
  favicon: assets/logo-mark-dark.svg
  chapters:
    - index.qmd
    - part: "Part I: The Framework"
      chapters:
        - chapters/01-diagnosis.qmd
        - chapters/02-co-operating-model.qmd
        - chapters/03-the-framework.qmd
    - part: "Part II: Strategy"
      chapters:
        - chapters/04-signal.qmd
        - chapters/05-source.qmd
    - part: "Part III: Designing the System"
      chapters:
        - chapters/06-designing-the-system.qmd
        - chapters/06b-designing-the-work.qmd
    - part: "Part IV: Launching"
      chapters:
        - chapters/07-build.qmd
        - chapters/08-deliver.qmd
    - part: "Part V: Learn to Compound"
      chapters:
        - chapters/09-compound.qmd
        - chapters/10-the-rhythm.qmd
        - chapters/11-what-to-do-next.qmd
    - part: "Case Studies"
      chapters:
        - chapters/case-study-meridian.qmd
        - chapters/case-study-pm-agent-team.qmd
    - chapters/appendix-prompt-engineering.qmd
    - chapters/appendix-prompts.qmd
    - chapters/appendix-glossary.qmd
    - chapters/appendix-action-steps.qmd

format:
  html:
    theme:
      - cosmo
      - assets/brand.scss
    toc: true
    number-sections: false
    code-overflow: wrap
    fontsize: 1.0625rem
  pdf:
    documentclass: scrbook
    papersize: letter
    margin-top: 1in
    margin-bottom: 1in
    margin-left: 1.25in
    margin-right: 1in
    fontsize: 11pt
    linestretch: 1.4
    colorlinks: true
    linkcolor: black
    urlcolor: compoundred
    citecolor: compoundred
    toccolor: black
    pdf-engine: xelatex
    mainfont: "Bricolage Grotesque"
    sansfont: "Archivo"
    monofont: "JetBrains Mono"
    include-in-header: assets/preamble.tex
  epub:
    toc: true
    cover-image: assets/cover.png
    css: assets/epub.css
    epub-cover-image: assets/cover.png
