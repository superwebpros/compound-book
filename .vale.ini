# Vale config for Co-Intelligent Co-Operation
# Compound style enforces the voice charter (_julie/voice-charter.md)
# Run: vale --output=JSON chapters/01-diagnosis.qmd
# See: _julie/voice-charter.md, .claude/tools/voice-scan.py

StylesPath = .vale/styles
MinAlertLevel = suggestion

# Treat .qmd files as Markdown for Vale's parser
[formats]
qmd = md

[*.{md,qmd}]
BasedOnStyles = Compound
